# Tag register (CFIHOS-inspired). Numbering per docs/adr/0004.
# class: instrument | controller | final_element | calculated
# unit: UNECE Rec. 20 common code (as used by OPC UA EUInformation) plus symbol. Pressures absolute.
# range: engineering range [lo, hi]; nominal: design-case value.
