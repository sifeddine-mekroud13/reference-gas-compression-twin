[project]
name = "twincore"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "scipy>=1.13", "plant", "machinery", "thermo-ref", "engdata"]

[tool.uv.sources]
plant = { workspace = true }
machinery = { workspace = true }
thermo-ref = { workspace = true }
engdata = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twincore"]
