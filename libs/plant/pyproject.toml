[project]
name = "plant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "scipy>=1.13", "pyyaml>=6", "engdata", "thermo-ref", "machinery"]

[tool.uv.sources]
engdata = { workspace = true }
thermo-ref = { workspace = true }
machinery = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant"]
