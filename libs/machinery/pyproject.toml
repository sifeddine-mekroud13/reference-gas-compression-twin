[project]
name = "machinery"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26","thermo-ref"]

[tool.uv.sources]
thermo-ref = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/machinery"]
