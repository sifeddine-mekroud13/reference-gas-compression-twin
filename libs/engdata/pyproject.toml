[project]
name = "engdata"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6", "jsonschema>=4.23", "thermo-ref", "machinery"]

[project.scripts]
engdata = "engdata.__main__:main"

[tool.uv.sources]
thermo-ref = { workspace = true }
machinery = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engdata"]
