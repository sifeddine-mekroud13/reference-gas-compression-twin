[project]
name = "rgpf-services"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "plant", "engdata", "thermo-ref", "machinery", "twincore",
  "asyncua>=1.1.5", "asyncpg>=0.29", "cryptography>=43",
  "fastapi>=0.115", "uvicorn>=0.32", "pyjwt[crypto]>=2.9", "httpx>=0.27",
  "scikit-learn>=1.5", "scipy>=1.13",
]

[tool.uv.sources]
plant = { workspace = true }
twincore = { workspace = true }
engdata = { workspace = true }
thermo-ref = { workspace = true }
machinery = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_common", "src/svc_opcua", "src/svc_collector", "src/svc_twin", "src/svc_diode", "src/svc_api", "src/svc_cmms"]
