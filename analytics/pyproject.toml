[project]
name = "rgpf-analytics"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "scipy>=1.13", "scikit-learn>=1.5", "plant", "twincore", "thermo-ref"]

[project.optional-dependencies]
benchmarks = ["pyreadr>=0.5"]

[tool.uv.sources]
plant = { workspace = true }
twincore = { workspace = true }
thermo-ref = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]
